<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대기 등록</title>
<link rel="stylesheet" href="style.css">
<style>
.menu-select-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E2E9F4; }
.menu-select-row:last-child { border-bottom: none; }
.menu-select-name { font-size: 14px; font-weight: 700; }
.menu-select-price { font-size: 12px; font-weight: 400; color: #8898AA; margin-left: 6px; }
.qty-stepper { display: flex; align-items: center; gap: 10px; }
.qty-stepper button { width: 28px; height: 28px; margin: 0; padding: 0; border-radius: 8px; font-size: 16px; line-height: 1; }
.qty-stepper .qty-value { min-width: 16px; text-align: center; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"><div class="bar"></div></div>
<div class="card">
  <img id="logoImg" class="brand-logo" alt="업체 로고">
  <h1 id="title">대기 등록</h1>
  <p class="desc">이름과 인원수를 입력하고 등록하면, 문자 없이 이 웹페이지에서 대기 순서를 바로 확인하실 수 있습니다.</p>

  <p class="hint" id="checking">이전 대기 정보를 확인하는 중입니다...</p>

  <form id="regForm" style="display:none">
    <label>이름</label>
    <input type="text" id="name" required placeholder="홍길동">

    <label>인원수</label>
    <input type="number" id="partySize" min="1" required value="2">

    <label>연락처 (선택)</label>
    <input type="tel" id="phone" placeholder="010-0000-0000">

    <div id="menuSection" style="display:none">
      <label>메뉴 선택 (선택, 미리 담아두시면 도착 즉시 준비해드립니다)</label>
      <div id="menuItems"></div>
    </div>

    <button type="submit">대기 등록하기</button>
  </form>
  <div class="error" id="err"></div>
</div>

<script src="progress.js"></script>
<script>
const form = document.getElementById('regForm');
const err = document.getElementById('err');
const checking = document.getElementById('checking');
const TOKEN_KEY = 'waitlistToken';
const VISITOR_KEY = 'waitlistVisitorId';

// 손님을 특정하지 않고도(연락처 미입력 시) 재방문 여부를 알 수 있도록,
// 이 브라우저에 고정된 방문자 ID를 하나 만들어 둔다.
let visitorId = localStorage.getItem(VISITOR_KEY);
if (!visitorId) {
  visitorId = crypto.randomUUID();
  localStorage.setItem(VISITOR_KEY, visitorId);
}

fetch('/api/settings')
  .then((res) => res.json())
  .then((data) => {
    document.getElementById('title').textContent = `${data.businessName} 대기 등록`;
    if (data.logoData) {
      const logoImg = document.getElementById('logoImg');
      logoImg.src = data.logoData;
      logoImg.style.display = 'block';
    }
    if (data.showMenuOnRegister !== false) loadMenuOptions();
  })
  .catch(() => {});

// 이 브라우저에 저장된 대기 토큰이 있으면, 아직 대기 중인지 확인해서
// 유효하면 등록 폼 대신 바로 대기 현황 페이지로 보내준다.
// (착석/노쇼/취소 등으로 이미 끝난 대기라면 저장된 토큰을 지우고 새로 등록하게 한다.)
async function checkSavedToken() {
  const savedToken = localStorage.getItem(TOKEN_KEY);
  if (!savedToken) {
    showForm();
    return;
  }
  showProgress();
  try {
    const res = await fetch(`/api/status/${savedToken}`);
    const data = await res.json();
    if (res.ok && data.status === 'waiting') {
      location.href = `status.html?token=${savedToken}`;
      return;
    }
  } catch (e) {
    // 확인 실패 시에도 등록 폼은 보여준다
  } finally {
    hideProgress();
  }
  localStorage.removeItem(TOKEN_KEY);
  showForm();
}

function showForm() {
  checking.style.display = 'none';
  form.style.display = 'block';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const menuSection = document.getElementById('menuSection');
const menuItemsEl = document.getElementById('menuItems');

async function loadMenuOptions() {
  try {
    const res = await fetch('/api/menu');
    const data = await res.json();
    const available = (data.menu || []).filter((item) => item.available);
    if (available.length === 0) return;

    menuItemsEl.innerHTML = available
      .map(
        (item) => `
        <div class="menu-select-row" data-id="${item.id}">
          <span class="menu-select-name">${escapeHtml(item.name)}<span class="menu-select-price">${item.price.toLocaleString()}원</span></span>
          <div class="qty-stepper">
            <button type="button" class="qty-minus">−</button>
            <span class="qty-value">0</span>
            <button type="button" class="qty-plus">+</button>
          </div>
        </div>
      `
      )
      .join('');

    menuItemsEl.querySelectorAll('.menu-select-row').forEach((row) => {
      const valueEl = row.querySelector('.qty-value');
      row.querySelector('.qty-minus').addEventListener('click', () => {
        valueEl.textContent = Math.max(0, Number(valueEl.textContent) - 1);
      });
      row.querySelector('.qty-plus').addEventListener('click', () => {
        valueEl.textContent = Number(valueEl.textContent) + 1;
      });
    });

    menuSection.style.display = 'block';
  } catch (e) {
    // 메뉴를 불러오지 못해도 대기 등록 자체는 계속 진행할 수 있어야 한다
  }
}

function collectOrderItems() {
  return Array.from(menuItemsEl.querySelectorAll('.menu-select-row'))
    .map((row) => ({ id: Number(row.dataset.id), qty: Number(row.querySelector('.qty-value').textContent) }))
    .filter((item) => item.qty > 0);
}

checkSavedToken();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  const name = document.getElementById('name').value.trim();
  const partySize = document.getElementById('partySize').value;
  const phone = document.getElementById('phone').value.trim();
  const submitBtn = form.querySelector('button[type=submit]');

  showProgress();
  submitBtn.disabled = true;
  try {
    const orderItems = collectOrderItems();
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, partySize, phone, visitorId, orderItems }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '등록에 실패했습니다.');
    localStorage.setItem(TOKEN_KEY, data.token);
    location.href = `status.html?token=${data.token}&visit=${data.visitCount}`;
  } catch (e2) {
    err.textContent = e2.message;
    submitBtn.disabled = false;
    hideProgress();
  }
});
</script>
</body>
</html>
