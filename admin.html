<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슈퍼 어드민 · 학내 고발 검수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B3E; --navy2:#162248; --navy3:#1E2F5C;
  --cyan:#00E5D4; --cyan2:#00BFB3; --cyan-lt:rgba(0,229,212,.10);
  --white:#fff; --slate:#F0F4FA; --slate2:#E2E9F4;
  --gray:#8898AA; --gray2:#556077; --gold:#F59E0B; --txt:#1A2540;
  --red:#EF4444; --green:#10B981;
}
body{font-family:'Noto Sans KR',sans-serif;color:var(--txt);background:var(--slate);min-height:100vh}
.num{font-family:'Inter',sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}

/* ── 로그인 화면 ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);position:relative;overflow:hidden;padding:20px}
#login .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,212,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,212,.05) 1px,transparent 1px);background-size:48px 48px}
#login .glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,212,.16),transparent 70%);top:-160px;right:-120px}
.login-card{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;border-radius:18px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .lock{width:54px;height:54px;border-radius:14px;background:var(--cyan-lt);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
.login-card h1{font-size:21px;font-weight:900;color:var(--navy)}
.login-card .sub{font-size:13px;color:var(--gray2);line-height:1.7;margin:8px 0 22px}
.login-card label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:7px}
.login-card input{width:100%;font-family:inherit;font-size:14px;background:var(--slate);border:1px solid var(--slate2);border-radius:10px;padding:13px 14px}
.login-card input:focus{outline:none;border-color:var(--cyan2);box-shadow:0 0 0 3px var(--cyan-lt);background:#fff}
.pw-meta{font-size:11px;margin-top:7px;min-height:16px}
.pw-meta.bad{color:var(--red)} .pw-meta.ok{color:var(--green)}
.login-card button{width:100%;margin-top:18px;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;padding:14px;border-radius:10px;background:var(--cyan);color:var(--navy);transition:opacity .15s}
.login-card button:disabled{opacity:.45;cursor:not-allowed}
.login-err{font-size:12px;color:var(--red);margin-top:12px;min-height:16px;text-align:center}

/* ── 대시보드 ── */
#dash{display:none}
.topbar{background:var(--navy);color:#fff;padding:18px 0}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between}
.topbar .brand{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.topbar .logout{font-size:12px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 13px;cursor:pointer;font-family:inherit}

.tabs{display:flex;gap:6px;margin:24px 0 18px;flex-wrap:wrap}
.tab{font-size:13px;font-family:inherit;cursor:pointer;border:1px solid var(--slate2);background:#fff;color:var(--gray2);border-radius:30px;padding:8px 16px;font-weight:700}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.item{background:#fff;border:1px solid var(--slate2);border-radius:14px;padding:20px;margin-bottom:14px}
.item .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.item .title{font-size:16px;font-weight:800;color:var(--navy);line-height:1.4}
.item .st{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.st.pending{background:#FEF6E7;color:#92600A} .st.published{background:#E7F8F1;color:#0F6B4A} .st.rejected{background:#FDECEC;color:#B42318}
.item .meta{font-size:11px;color:var(--gray);margin-top:6px}
.item .cats{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.item .cat{font-size:10px;background:var(--slate);color:var(--gray2);border-radius:6px;padding:3px 8px}
.item .body{margin-top:14px;background:var(--slate);border-radius:10px;padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--txt);border-left:3px solid var(--cyan2)}
.item .body .lbl{display:block;font-size:11px;font-weight:700;color:var(--cyan2);margin-bottom:6px}
.item .acts{display:flex;gap:8px;margin-top:14px}
.item .acts button{font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;border:none;border-radius:9px;padding:10px 18px}
.btn-pub{background:var(--green);color:#fff} .btn-rej{background:#fff;color:var(--red);border:1px solid #F6C4C4!important}
.btn-pub:disabled,.btn-rej:disabled{opacity:.5;cursor:wait}
.empty{text-align:center;color:var(--gray);font-size:14px;padding:50px 0}
.warn{font-size:12px;line-height:1.7;color:#92600A;background:#FEF6E7;border:1px solid #F6E2B8;border-radius:10px;padding:13px 15px;margin-bottom:18px}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="grid"></div><div class="glow"></div>
  <div class="login-card">
    <div class="lock">🔐</div>
    <h1>슈퍼 어드민</h1>
    <p class="sub">고발 본문은 인증된 슈퍼 어드민만 열람할 수 있습니다. 암호를 입력하세요.</p>
    <label for="pw">슈퍼 어드민 암호</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="20자 이상">
    <div class="pw-meta" id="pwMeta"></div>
    <button id="loginBtn" disabled>로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dash">
  <div class="topbar">
    <div class="wrap">
      <div class="brand"><span class="dot"></span>슈퍼 어드민 · 고발 검수</div>
      <button class="logout" id="logout">로그아웃</button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-status="pending">검수 대기</button>
      <button class="tab" data-status="published">공개됨</button>
      <button class="tab" data-status="rejected">반려됨</button>
      <button class="tab" data-status="all">전체</button>
    </div>
    <div class="warn">⚠️ 이 화면의 본문은 비공개 정보입니다. 처리 목적 외 열람·유출은 금지됩니다.</div>
    <div id="list"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const MIN_LEN = 20;
let token = sessionStorage.getItem('admin_token') || '';
let curStatus = 'pending';

// ── 로그인 폼 ──
const pw = $('pw'), loginBtn = $('loginBtn'), pwMeta = $('pwMeta');
pw.addEventListener('input', () => {
  const n = pw.value.length;
  loginBtn.disabled = n < MIN_LEN;
  if (!n) { pwMeta.textContent = ''; pwMeta.className = 'pw-meta'; }
  else if (n < MIN_LEN) { pwMeta.textContent = `${MIN_LEN}자 이상 필요 (현재 ${n}자)`; pwMeta.className = 'pw-meta bad'; }
  else { pwMeta.textContent = `사용 가능 (${n}자)`; pwMeta.className = 'pw-meta ok'; }
});
pw.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !loginBtn.disabled) doLogin(); });
loginBtn.addEventListener('click', doLogin);

async function doLogin() {
  const candidate = pw.value;
  $('loginErr').textContent = '';
  loginBtn.disabled = true; loginBtn.textContent = '확인 중…';
  const ok = await verify(candidate);
  loginBtn.textContent = '로그인';
  if (ok) {
    token = candidate;
    sessionStorage.setItem('admin_token', token);
    enterDash();
  } else {
    loginBtn.disabled = false;
    $('loginErr').textContent = '암호가 올바르지 않거나 관리 기능이 비활성화되어 있습니다.';
    pw.value = ''; loginBtn.disabled = true; pwMeta.textContent = ''; pwMeta.className = 'pw-meta';
  }
}

// 인증 검증: pending 목록 호출이 200이면 성공
async function verify(tok) {
  try {
    const res = await fetch('/api/admin?status=pending', { headers: { Authorization: 'Bearer ' + tok } });
    return res.status === 200;
  } catch { return false; }
}

// ── 대시보드 ──
function enterDash() {
  $('login').style.display = 'none';
  $('dash').style.display = 'block';
  load();
}
function logout() {
  token = ''; sessionStorage.removeItem('admin_token');
  $('dash').style.display = 'none';
  $('login').style.display = 'flex';
  pw.value = ''; loginBtn.disabled = true; pwMeta.textContent = '';
}
$('logout').addEventListener('click', logout);

document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
  t.classList.add('active');
  curStatus = t.dataset.status;
  load();
}));

async function load() {
  const box = $('list');
  box.innerHTML = '<div class="empty">불러오는 중…</div>';
  let data;
  try {
    const res = await fetch('/api/admin?status=' + curStatus, { headers: { Authorization: 'Bearer ' + token } });
    if (res.status === 401 || res.status === 503) return logout();
    data = await res.json();
  } catch { box.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>'; return; }

  const items = data.items || [];
  if (!items.length) { box.innerHTML = '<div class="empty">항목이 없습니다.</div>'; return; }
  box.innerHTML = items.map(render).join('');
  box.querySelectorAll('[data-act]').forEach((b) =>
    b.addEventListener('click', () => act(b.dataset.id, b.dataset.act, b)));
}

function render(it) {
  const d = new Date(it.created_at);
  const date = isNaN(d) ? '' : `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const cats = (it.categories || []).filter((c) => c !== 'none')
    .map((c) => `<span class="cat">${esc(c)}</span>`).join('');
  const acts = it.status === 'pending'
    ? `<div class="acts">
         <button class="btn-pub" data-act="publish" data-id="${it.id}">승인 · 공개</button>
         <button class="btn-rej" data-act="reject" data-id="${it.id}">반려</button>
       </div>` : '';
  return `<div class="item">
    <div class="head">
      <div class="title">${esc(it.title)}</div>
      <span class="st ${it.status}">${stLabel(it.status)}</span>
    </div>
    <div class="meta">${date} · <span class="num">${it.id.slice(0,8)}</span></div>
    ${cats ? `<div class="cats">${cats}</div>` : ''}
    <div class="body"><span class="lbl">🔓 복호화된 고발 본문 (비공개)</span>${esc(it.body || '')}</div>
    ${acts}
  </div>`;
}

async function act(id, action, btn) {
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '처리 중…';
  try {
    const res = await fetch('/api/admin', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, action }),
    });
    if (res.status === 401 || res.status === 503) return logout();
    if (!res.ok) throw new Error();
    load();
  } catch { btn.disabled = false; btn.textContent = orig; alert('처리에 실패했습니다.'); }
}

const stLabel = (s) => ({ pending: '검수 대기', published: '공개됨', rejected: '반려됨' }[s] || s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// 세션에 토큰이 남아 있으면 자동 진입 시도
if (token) verify(token).then((ok) => ok ? enterDash() : sessionStorage.removeItem('admin_token'));
</script>
</body>
</html>
